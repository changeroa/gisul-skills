# buildEnvironment adds the pinned model, MCP descriptors and filesystem denies.
# A profile without those generated fields cannot start an evaluation.
model_provider = "openai"
approval_policy = "never"
default_permissions = "eval"
web_search = "disabled"
cli_auth_credentials_store = "file"
analytics.enabled = false
feedback.enabled = false
apps._default.enabled = false
shell_environment_policy.inherit = "none"
features.apps = false
features.browser_use = false
features.browser_use_external = false
features.browser_use_full_cdp_access = false
features.in_app_browser = false
features.in_app_chat = false
features.in_app_local_automation = false
features.computer_use = false
features.image_generation = false
features.hooks = false
features.plugin_hooks = false
features.plugins = false
features.remote_plugin = false
features.plugin_sharing = false
features.recommended_plugins = false
features.skill_mcp_dependency_install = false
features.memories = false
features.external_agent_memory_import = false
features.chronicle = false
features.multi_agent = false
features.multi_agent_v2 = false
features.goals = false
features.shell_snapshot = false
features.shell_snapshot_v2 = false
features.step_model_switching = false
features.workspace_dependencies = false
features.unbounded_connection_retries = false
