name: Manually publish immutable R2 release
on:
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: 'Optional full commit of a retained verified release to reactivate'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: skillar-r2-production
  cancel-in-progress: false
jobs:
  require-target:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicitly configured current publication endpoint
        env:
          SKILLAR_RELEASE_BASE_URL: ${{ vars.SKILLAR_RELEASE_BASE_URL }}
        run: |
          if [ -z "${SKILLAR_RELEASE_BASE_URL//[[:space:]]/}" ]; then
            echo '::error::Manual R2 publication requires repository variable SKILLAR_RELEASE_BASE_URL. The former personal Cloudflare deployment is retired; no legacy endpoint fallback is used.'
            exit 1
          fi
  validate:
    needs: require-target
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Gate, upload, verify, read by pin, then activate
        run: node scripts/publish-r2.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKILLAR_RELEASE_BASE_URL: ${{ vars.SKILLAR_RELEASE_BASE_URL }}
          SKILLAR_PUBLISH_TOKEN: ${{ secrets.SKILLAR_PUBLISH_TOKEN || secrets.GISUL_PUBLISH_TOKEN }}
          SKILLAR_BEARER_TOKEN: ${{ secrets.SKILLAR_BEARER_TOKEN || secrets.GISUL_BEARER_TOKEN }}
          SKILLAR_ROLLBACK_COMMIT: ${{ inputs.rollback_commit }}
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/receipts/r2-publication.json
          if-no-files-found: ignore
          retention-days: 90
