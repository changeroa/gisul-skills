name: Validate skills
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: changeroa/gisul
          ref: 132cadd6ddc27f3f8dde763da8e1b67fec34dc96
          path: .ci/gisul
      - run: npm ci
      - name: Install the runtime example browser
        run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Prepare the pinned server and actual Worker runtime
        run: |
          npm --prefix .ci/gisul/server ci
          npm --prefix .ci/gisul/server run build
          npm --prefix .ci/gisul/worker ci
          npm --prefix .ci/gisul/worker run typecheck
      - name: Verify catalog, publisher and actual serving contracts
        run: npm test
        env:
          GISUL_SERVER_PATH: ${{ github.workspace }}/.ci/gisul/server/dist/index.js
          GISUL_WORKER_PATH: ${{ github.workspace }}/.ci/gisul/worker
